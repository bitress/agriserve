<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Scanner</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,700,900" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <style>

        h3 {
            text-align: center;
            color: #333;
        }

        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 100%; /* Set a max-width for responsiveness */
            flex-grow: 1; /* Grow to fill available space */
        }

        #scanner {
            width: 100%;
            height: auto;
            border: 5px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
            transform: scaleX(-1);
        }

    </style>
</head>
<body>

    <header>
        <div class="head_container">
          <div class="logo">
            <img src="img/agrilogo.png">
            <a href="#">AgriServe</a>
          </div>
          <div class="menu" id="myTopnav">
            <ul>
              <a href="javascript:void(0);" style="font-size:15px;" class="icon" onclick="openNav()">&#9776;</a>
              <li>
                <a href="#">About</a>
              </li>
            </ul>
          </div>
        </div>
        <!-- Responsive Cover Photo -->
        <img src="img/banner.png" alt="Cover Photo" class="cover-photo">
      </header>
      <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#">About</a>
      </div>
      <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#">About</a>
      </div><br>

    <h3>SCAN QR CODE</h3>
    <div id="scanner-container">
        <video id="scanner" playsinline></video>
    </div>

    <br>  

    <footer class="main-footer">
      <div class="container">
        <p class="footer-text"> &copy; AgriServe - Sudipen 2023 </p>
      </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById('scanner');
            
            // Initialize Instascan
            const scanner = new Instascan.Scanner({ video });

            // Add a callback for when a QR code is scanned
            scanner.addListener('scan', function (content) {
                // Ask the user if they want to go to the scanned website
                const confirmRedirect = confirm(`Do you want to go to the website?\n\n${content}`);

                if (confirmRedirect) {
                    // Open the scanned URL in a new tab
                    window.open(content, '_blank');
                }
            });

            // Get the available cameras
            Instascan.Camera.getCameras().then(function (camList) {
                const cameras = camList;

                // Start the Instascan scanner with the back camera if available
                const backCamera = cameras.find(camera => !camera.name.toLowerCase().includes('front'));
                const startCamera = backCamera || cameras[0];

                if (startCamera) {
                    // Set transform to flip the video horizontally
                    video.style.transform = 'scaleX(-1)';
                    scanner.start(startCamera);
                } else {
                    console.error('No cameras found.');
                }
            }).catch(function (error) {
                console.error(error);
            });
        });
    </script>

    <script>
        function openNav() {
        document.getElementById("mySidenav").style.width = "250px";
        //document.getElementById("header").style.marginLeft = "250px";
        }

        function closeNav() {
        document.getElementById("mySidenav").style.width = "0";
        //document.getElementById("header").style.marginLeft= "0";
        };
    </script>
</body>
</html>
